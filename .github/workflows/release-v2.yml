name: Publish CSDM v2.0 Release

on:
  workflow_run:
    workflows: ["Build and Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    # A published release must correspond to a successful production Pages build,
    # not just a passing development-branch CI run.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish release once after successful production deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(node -p "require('./package.json').version")" != "2.0.0" ]; then
            echo "This deployment does not contain the 2.0.0 release; skipping."
            exit 0
          fi
          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "Release v2.0.0 already exists."
            exit 0
          fi
          gh release create v2.0.0 \
            --target "$TARGET_SHA" \
            --title "CSDM Visualizer v2.0.0 - Architecture and Remediation Workbench" \
            --notes-file docs/RELEASE_NOTES_2.0.md \
            --latest
