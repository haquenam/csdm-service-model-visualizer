name: Prepare v2.1 dependency lock
on:
  push:
    branches: [release/v2.1.0]
    paths:
      - package.json
      - .github/workflows/refresh-lock-v21.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.1.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate pinned dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile back to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v2.1): lock local frontend dependencies"
            git push origin HEAD:release/v2.1.0
          fi
